apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark
  template:
    metadata:
      labels:
        app: spark
    spec:
      containers:
        - name: spark
          image: spark-job:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKER
              value: "kafka-0.kafka:9092"
            - name: POSTGRES_HOST
              value: "postgres"
          command: ["spark-submit", "--packages", "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.postgresql:postgresql:42.7.1", "/iacd_project/spark_job.py"]
